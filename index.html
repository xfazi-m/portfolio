    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background-color: #080808;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .page-shell {
      position: relative;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.25rem 1.5rem 2rem 1.5rem;
      background-color: #080808;
    }

    .top-header {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 0.25rem;
      opacity: 0;
      transform: translateY(-16px);
      transition: opacity 0.75s cubic-bezier(0.215, 0.61, 0.355, 1), transform 0.75s cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .top-header.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      overflow: visible;
    }

    .logo-img {
      height: 46px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .center-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
      padding: 3rem 0;
    }

    .char,
    .word {
      display: inline-block;
    }

    .word {
      white-space: nowrap;
    }

    .char {
      opacity: 0;
      transform: translateY(26px);
      color: #111111;
      transition: opacity 0.8s cubic-bezier(0.215, 0.61, 0.355, 1), transform 0.8s cubic-bezier(0.215, 0.61, 0.355, 1), color 0.8s cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .char.is-visible {
      opacity: 1;
      transform: translateY(0);
      color: #ffffff;
    }

    .main-heading {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif;
      font-size: clamp(2.6rem, 7vw, 4.9rem);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 1.25rem;
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.85s cubic-bezier(0.215, 0.61, 0.355, 1), transform 0.85s cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .reveal-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
      font-size: clamp(1.02rem, 2.4vw, 1.2rem);
      line-height: 1.55;
      letter-spacing: -0.015em;
      color: rgba(255, 255, 255, 0.7);
      max-width: 500px;
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    .contact-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem 0.55rem 0.55rem 1.35rem;
      border-radius: 9999px;
      background:
        radial-gradient(55% 55% at 10% 8%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 62%) padding-box,
        linear-gradient(165deg, #131316 0%, #09090b 100%) padding-box,
        radial-gradient(52% 88% at 10% 4%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.35) 42%, rgba(255, 255, 255, 0) 76%) border-box,
        radial-gradient(52% 88% at 90% 96%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.3) 42%, rgba(255, 255, 255, 0) 76%) border-box,
        linear-gradient(135deg, rgba(255, 255, 255, 0.36) 0%, rgba(255, 255, 255, 0.07) 36%, rgba(255, 255, 255, 0.07) 64%, rgba(255, 255, 255, 0.32) 100%) border-box;
      border: 1.5px solid transparent;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.16),
        0 20px 50px rgba(0, 0, 0, 0.85);
      max-width: 100%;
    }

    .email-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: #ffffff;
      font-size: 1.02rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      user-select: text;
    }

    .email-icon {
      width: 19px;
      height: 19px;
      color: rgba(255, 255, 255, 0.7);
      flex-shrink: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.78rem 1.35rem;

      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;

      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.12);
    }

    .copy-btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.22);
    }

    .copy-btn:active {
      transform: scale(0.97);
    }

    .copy-btn.is-copied {
      background-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .copy-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .bottom-footer {
      position: relative;
      z-index: 10;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.42);
      text-align: center;
    }

    @media (max-width: 600px) {
      .page-shell {
        padding: 1.75rem 1.25rem 1.5rem 1.25rem;
      }

      .logo-img {
        height: 48px;
      }

      .contact-card {
        flex-direction: column;
        width: 100%;
        max-width: 360px;
        border-radius: 1.5rem;
        padding: 1.15rem;
        gap: 1rem;
      }

      .email-wrap {
        font-size: 0.98rem;
      }

      .copy-btn {
        width: 100%;
        padding: 0.85rem 1.25rem;
      }

    <main class="center-content">
      <h1 class="main-heading" id="heroHeading">Strona w budowie</h1>

      <p class="subtitle reveal-item" data-delay="0.45">
        Pracuję nad nową wersją strony. Jeśli chcesz nawiązać współpracę lub masz pytanie, zapraszam do kontaktu mailowego:
      </p>

      <div class="contact-card reveal-item" data-delay="0.57">
        <div class="email-wrap">
          <svg class="email-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span id="emailText">xfazi.pl@gmail.com</span>
        </div>

        <button type="button" class="copy-btn" id="copyBtn" aria-label="Skopiuj adres e-mail">
          <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
          </svg>
          <span id="copyBtnLabel">Skopiuj adres</span>
        </button>
      </div>
    </main>

    <footer class="bottom-footer reveal-item" data-delay="0.69">
      &copy; 2026 xfazi.pl
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      const heading = document.getElementById('heroHeading');
      const charElements = [];

      if (heading) {
        const text = heading.textContent.trim();
        heading.textContent = '';
        const words = text.split(/\s+/);

        words.forEach(function (wordText, wordIndex) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';

          for (let i = 0; i < wordText.length; i++) {
            const charSpan = document.createElement('span');
            charSpan.className = 'char';
            charSpan.textContent = wordText[i];
            const delay = 0.18 + charElements.length * 0.032;
            charSpan.style.transitionDelay = delay.toFixed(3) + 's';
            wordSpan.appendChild(charSpan);
            charElements.push(charSpan);
          }

          heading.appendChild(wordSpan);
          if (wordIndex < words.length - 1) {
            heading.appendChild(document.createTextNode(' '));
          }
        });
      }

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          const topHeader = document.getElementById('topHeader');
          if (topHeader) {
            topHeader.classList.add('is-visible');
          }

          charElements.forEach(function (charEl) {
            charEl.classList.add('is-visible');
          });

          document.querySelectorAll('.reveal-item').forEach(function (el) {
            const delay = el.getAttribute('data-delay') || '0.45';
            el.style.transitionDelay = delay + 's';
            el.classList.add('is-visible');
          });
        });
      });

      const copyBtn = document.getElementById('copyBtn');
      const copyBtnLabel = document.getElementById('copyBtnLabel');
      const copyIcon = document.getElementById('copyIcon');
      const email = 'xfazi.pl@gmail.com';
      let resetTimer = null;

      const defaultIconMarkup =
        '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>' +
        '<path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>';

      const checkIconMarkup =
        '<polyline points="20 6 9 17 4 12"></polyline>';

      function showCopiedState() {
        copyBtn.classList.add('is-copied');
        copyBtnLabel.textContent = 'Skopiowano!';
        copyIcon.innerHTML = checkIconMarkup;

        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          copyBtn.classList.remove('is-copied');
          copyBtnLabel.textContent = 'Skopiuj adres';
          copyIcon.innerHTML = defaultIconMarkup;
        }, 2200);
      }

      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(email).then(showCopiedState).catch(function () {
              fallbackCopy(email);
            });
          } else {
            fallbackCopy(email);
          }
        });
      }

      function fallbackCopy(text) {
        const tempInput = document.createElement('input');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showCopiedState();
      }
    });
  </script>
